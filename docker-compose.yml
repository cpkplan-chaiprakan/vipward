name: vipward

services:
  db:
    image: mysql:8.4
    container_name: vipward-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cpkhospita_cpkdoctor
      MYSQL_USER: cpkhospita_cpkdoctor
      MYSQL_PASSWORD: vipward_local
      MYSQL_ROOT_PASSWORD: vipward_root
    ports:
      - "3307:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - vipward_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pvipward_root"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: vipward-api
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: cpkhospita_cpkdoctor
      DB_PASS: vipward_local
      DB_NAME: cpkhospita_cpkdoctor
      DB_CHARSET: utf8mb4
    ports:
      - "8088:80"
    volumes:
      - ./api:/var/www/html/api
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: vipward-web
    restart: unless-stopped
    environment:
      VITE_BASE_PATH: /
      VITE_API_PROXY: http://api
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3001:5173"
    volumes:
      - .:/app
      - vipward_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  vipward_mysql:
  vipward_node_modules:
